config_version = 20

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 800.0
    cy = 818.0
    output = "eDP-1"
    placement_height = 1000.0
    placement_width = 1600.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_media_controls = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
mode = "dark"
pure_black_dark = false
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    enable_builtin_templates = false

[wallpaper]
directory = "/home/nathan/Pictures/wallpapers"

    [wallpaper.default]
    path = "/home/nathan/Pictures/wallpapers/plugwalk_pixel.png"

    [wallpaper.last]
    path = "/home/nathan/Pictures/wallpapers/plugwalk_pixel.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/nathan/Pictures/wallpapers/plugwalk_pixel.png"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/nathan/Pictures/wallpapers/plugwalk_pixel.png"
    theme_mode = "dark"
    wallpaper_scheme = "m3-content"